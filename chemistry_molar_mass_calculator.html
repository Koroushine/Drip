<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --chemistry-color: #4ECDC4;
            --chemistry-light: #7EDDD6;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            --shadow-hover: 0 20px 60px rgba(0, 0, 0, 0.3);
            --radius: 24px;
            --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #0d1a2d 30%, #0a1a1a 60%, #150a20 100%);
            min-height: 100vh;
            color: white;
            position: relative;
        }

        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
            background-image: linear-gradient(rgba(78, 205, 196, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(78, 205, 196, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 25s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        .orb {
            position: fixed; border-radius: 50%; filter: blur(100px); pointer-events: none; z-index: 0;
            animation: orbFloat 12s ease-in-out infinite;
        }
        .orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(78, 205, 196, 0.3), transparent 70%); top: -150px; right: -150px; }
        .orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(126, 221, 214, 0.25), transparent 70%); bottom: -100px; left: -100px; animation-delay: -4s; }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, -50px) scale(1.2); }
        }

        .main-container {
            position: relative; z-index: 2; min-height: 100vh;
            padding: 30px 24px 50px; max-width: 1000px; margin: 0 auto;
        }

        /* Navigation */
        .nav-bar {
            display: flex; align-items: center; gap: 16px; margin-bottom: 30px;
            flex-wrap: wrap; animation: slideDown 0.6s ease-out;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .back-btn {
            width: 48px; height: 48px; border-radius: 16px;
            background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); color: white;
            font-size: 20px; cursor: pointer; transition: all 0.3s;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none;
        }
        .back-btn:hover { background: rgba(78, 205, 196, 0.3); transform: translateX(-4px); }
        .breadcrumb { display: flex; align-items: center; gap: 10px; font-size: 15px; color: rgba(255, 255, 255, 0.7); }
        .breadcrumb span { color: rgba(255, 255, 255, 0.5); cursor: pointer; transition: color 0.3s; }
        .breadcrumb span:hover { color: white; }
        .breadcrumb .current { color: #4ECDC4; font-weight: 600; }
        .subject-badge {
            background: linear-gradient(135deg, #4ECDC4, #7EDDD6);
            padding: 8px 20px; border-radius: 100px; font-weight: 700; font-size: 14px;
            margin-left: auto; box-shadow: 0 4px 15px rgba(78, 205, 196, 0.4);
        }

        /* Header */
        .page-header {
            text-align: center; margin-bottom: 40px; animation: fadeInUp 0.8s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .page-header h1 {
            font-size: 44px; font-weight: 900;
            background: linear-gradient(135deg, #fff, #7EDDD6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin-bottom: 8px;
        }
        .page-header .subtitle { font-size: 16px; color: rgba(255, 255, 255, 0.6); letter-spacing: 2px; }

        /* Tool */
        .tool-container {
            background: var(--glass); backdrop-filter: blur(30px);
            border: 1.5px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 32px;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .input-section {
            display: flex; flex-direction: column; gap: 20px;
        }

        .formula-input {
            display: flex; flex-wrap: wrap; gap: 12px;
            align-items: center;
        }
        .formula-input label {
            font-weight: 600; color: rgba(255,255,255,0.8);
            min-width: 80px;
        }
        .formula-input input {
            flex: 1; min-width: 200px;
            padding: 14px 20px;
            border-radius: 12px;
            background: rgba(255,255,255,0.06);
            border: 1.5px solid var(--glass-border);
            color: white;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;

        }
        .formula-input input:focus {

            box-shadow: 0 0 30px rgba(78, 205, 196, 0.1);
        }
        .formula-input input::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .btn-primary {

            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #4ECDC4, #2d9b94);
            color: white;
            font-size: 16px;

            cursor: pointer;

        .btn-secondary {

            background: transparent;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.05); }

        .examples-section {

            color: rgba(255,255,255,0.7);

        .example-chip:hover {

            border-top: 1px solid var(--glass-border);

        .result-section.visible { display: block; }

            border-radius: 16px;

            background-clip: text;

        .result-main .unit {

            margin-top: 16px;

            background: rgba(0,0,0,0.2);
            padding: 16px;
            border-radius: 12px;

            margin-bottom: 12px;
            font-size: 14px;

        .element-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 8px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            background: rgba(78, 205, 196, 0.06);
            border-radius: 8px;

            .page-header h1 { font-size: 26px; }

            .element-grid { grid-template-columns: 1fr; }

        function parseFormula(formula) {
            // Parse a chemical formula into element counts
            const atoms = {};
            let i = 0;
            let currentElement = '';
            let currentCount = '';

            while (i < formula.length) {
                const char = formula[i];

                // Check for opening parenthesis (simplified handling)
                if (char === '(' || char === '[') {
                    // Find matching closing parenthesis
                    let depth = 1;
                    let j = i + 1;
                    let subFormula = '';
                    while (j < formula.length && depth > 0) {
                        if (formula[j] === '(' || formula[j] === '[') depth++;
                        else if (formula[j] === ')' || formula[j] === ']') depth--;
                        if (depth > 0) subFormula += formula[j];
                        j++;
                    }
                    
                    // Get multiplier after the parenthesis
                    let multiplier = 1;
                    let multStr = '';
                    while (j < formula.length && formula[j] >= '0' && formula[j] <= '9') {
                        multStr += formula[j];
                        j++;
                    }
                    if (multStr) multiplier = parseInt(multStr);

                    // Parse the sub-formula and multiply
                    const subAtoms = parseFormula(subFormula);
                    for (const [el, count] of Object.entries(subAtoms)) {
                        atoms[el] = (atoms[el] || 0) + count * multiplier;
                    }

                    i = j;
                    continue;
                }

                // Check for closing parenthesis (should be handled above)
                if (char === ')' || char === ']') {
                    i++;
                    continue;
                }

                // Check if character is a capital letter (start of an element)
                if (char >= 'A' && char <= 'Z') {
                    // If we have a previous element, save it
                    if (currentElement) {
                        const count = currentCount ? parseInt(currentCount) : 1;
                        atoms[currentElement] = (atoms[currentElement] || 0) + count;
                        currentElement = '';
                        currentCount = '';
                    }

                    // Start new element
                    currentElement = char;
                    i++;
                    
                    // Check for lowercase second letter
                    if (i < formula.length && formula[i] >= 'a' && formula[i] <= 'z') {
                        currentElement += formula[i];
                        i++;
                    }
                } else if (char >= '0' && char <= '9') {
                    // Build the number
                    currentCount += char;
                    i++;
                } else {
                    // Skip other characters (like spaces, dots, etc.)
                    i++;
                }
            }

            // Save the last element
            if (currentElement) {
                const count = currentCount ? parseInt(currentCount) : 1;
                atoms[currentElement] = (atoms[currentElement] || 0) + count;
            }

            return atoms;
        }

        function calculateMolarMass() {
            const input = document.getElementById('formulaInput');
            const formula = input.value.trim();

            // Hide previous results
            document.getElementById('resultSection').classList.remove('visible');
            document.getElementById('errorMessage').classList.remove('visible');

            if (!formula) {
                showError('Please enter a chemical formula.');
                return;
            }

            // Remove subscripts formatting (like H₂O -> H2O)
            let cleanFormula = formula;
            // Replace subscript numbers with normal numbers
            cleanFormula = cleanFormula.replace(/[₀₁₂₃₄₅₆₇₈₉]/g, function(match) {
                const subscripts = { '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4', '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9' };
                return subscripts[match] || match;
            });

            // Parse the formula
            const atoms = parseFormula(cleanFormula);
            if (Object.keys(atoms).length === 0) {
                showError('Could not parse the formula. Please check your input.');
                return;
            }

            // Calculate total molar mass
            let totalMass = 0;
            const breakdown = [];

            for (const [symbol, count] of Object.entries(atoms)) {
                const element = ELEMENTS[symbol];
                if (!element) {
                    showError(`Unknown element: "${symbol}". Please check your formula.`);
                    return;
                }
                const mass = element.mass * count;
                totalMass += mass;
                breakdown.push({
                    symbol: symbol,
                    name: element.name,
                    count: count,
                    mass: mass,
                    atomicMass: element.mass
                });
            }

            // Display results
            displayResults(formula, totalMass, breakdown);
        }

        function displayResults(formula, totalMass, breakdown) {
            const resultSection = document.getElementById('resultSection');
            const resultFormula = document.getElementById('resultFormula');
            const resultMass = document.getElementById('resultMass');
            const resultDetails = document.getElementById('resultDetails');
            const elementGrid = document.getElementById('elementGrid');

            // Format the formula with subscripts for display
            let displayFormula = formula;
            // Convert numbers to subscripts for display
            displayFormula = displayFormula.replace(/([A-Za-z])(\d+)/g, '$1₀₁₂₃₄₅₆₇₈₉'.slice(0, 10));
            displayFormula = displayFormula.replace(/0/g, '₀').replace(/1/g, '₁').replace(/2/g, '₂').replace(/3/g, '₃').replace(/4/g, '₄')
                .replace(/5/g, '₅').replace(/6/g, '₆').replace(/7/g, '₇').replace(/8/g, '₈').replace(/9/g, '₉');

            resultFormula.textContent = displayFormula;
            resultMass.textContent = totalMass.toFixed(3);

            // Details cards
            const elementCount = breakdown.length;
            const totalAtoms = breakdown.reduce((sum, el) => sum + el.count, 0);

            resultDetails.innerHTML = `
                <div class="detail-card">
                    <div class="label">Elements</div>
                    <div class="value">${elementCount}</div>
                </div>
                <div class="detail-card">
                    <div class="label">Total Atoms</div>
                    <div class="value">${totalAtoms}</div>
                </div>
                <div class="detail-card">
                    <div class="label">Molar Mass</div>
                    <div class="value">${totalMass.toFixed(3)} g/mol</div>
                </div>
            `;

            // Element breakdown
            let elementHtml = '';
            breakdown.forEach(el => {
                const percentage = ((el.mass / totalMass) * 100).toFixed(1);
                elementHtml += `
                    <div class="element-item">
                        <div>
                            <span class="symbol">${el.symbol}</span>
                            <span class="name">${el.name}</span>
                        </div>
                        <div class="details">
                            <span class="count">×${el.count}</span>
                            <span class="mass">${el.mass.toFixed(3)} g</span>
                            <span style="color:rgba(255,255,255,0.4); font-size:12px;">${percentage}%</span>
                        </div>
                    </div>
                `;
            });
            elementGrid.innerHTML = elementHtml;

            resultSection.classList.add('visible');
            resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            document.getElementById('errorText').textContent = message;
            errorDiv.classList.add('visible');
            errorDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // Quick calculate on enter key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && document.activeElement === document.getElementById('formulaInput')) {
                calculateMolarMass();
            }
        });

        // Initialize with example on load
        window.addEventListener('load', function() {
            // Set initial example
            document.getElementById('formulaInput').value = 'H2O';
            // Auto-calculate after a short delay
            setTimeout(calculateMolarMass, 300);
        });
    </script>
</body>
</html>
