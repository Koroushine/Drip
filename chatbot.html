<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drip - AI Science Tutor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Add Markdown Library -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --ai-color: #A78BFA;
            --ai-light: #C4B5FD;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            --radius: 28px;
            --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1035 30%, #0d1a2d 60%, #150a20 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            color: white;
        }

        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
            background-image: 
                linear-gradient(rgba(167,139,250,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(167,139,250,0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 25s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        .orb {
            position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0;
            animation: orbFloat 12s ease-in-out infinite;
        }
        .orb-1 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(167,139,250,0.25), transparent 70%);
            top: -150px; right: -150px; animation-delay: 0s;
        }
        .orb-2 {
            width: 450px; height: 450px;
            background: radial-gradient(circle, rgba(255,107,107,0.2), transparent 70%);
            bottom: -150px; left: -150px; animation-delay: -4s;
        }
        .orb-3 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(251,191,36,0.15), transparent 70%);
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            animation-delay: -8s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(80px, -60px) scale(1.15); }
            50% { transform: translate(-40px, -100px) scale(0.9); }
            75% { transform: translate(-80px, 40px) scale(1.1); }
        }

        .main-container {
            position: relative; z-index: 2; min-height: 100vh;
            display: flex; flex-direction: column;
            padding: 20px 24px 40px;
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 0 30px;
            animation: headerEntrance 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes headerEntrance {
            0% { opacity: 0; transform: translateY(-40px); filter: blur(10px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            padding: 12px 24px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.15);
            color: white;
            transform: translateX(-5px);
        }

        .header-title {
            display: flex; align-items: center; gap: 16px;
        }
        .header-title .ai-icon {
            width: 50px; height: 50px;
            background: linear-gradient(135deg, #A78BFA, #8b6fe0);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: white;
            box-shadow: 0 8px 30px rgba(167,139,250,0.4);
        }
        .header-title h1 {
            font-size: 28px; font-weight: 800;
            background: linear-gradient(135deg, #fff, #C4B5FD);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-title .subtitle {
            font-size: 13px; color: rgba(255,255,255,0.5);
            -webkit-text-fill-color: rgba(255,255,255,0.5);
        }

        /* Server Status Badge */
        .server-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            padding: 6px 14px;
            border-radius: 100px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.5);
            transition: all 0.3s;
        }
        .server-status.online {
            color: #4CAF50;
            border-color: rgba(76,175,80,0.3);
            background: rgba(76,175,80,0.1);
        }
        .server-status.offline {
            color: #FF9800;
            border-color: rgba(255,152,0,0.3);
            background: rgba(255,152,0,0.1);
        }
        .server-status .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            background: currentColor;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            background: var(--glass);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1.5px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 24px;
            min-height: 600px;
            display: flex;
            flex-direction: column;
            animation: cardsEntrance 0.8s ease-out 0.4s both;
        }

        @keyframes cardsEntrance {
            0% { opacity: 0; transform: translateY(40px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding-right: 8px;
            max-height: 550px;
        }

        .messages-area::-webkit-scrollbar {
            width: 4px;
        }
        .messages-area::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        .messages-area::-webkit-scrollbar-thumb {
            background: rgba(167,139,250,0.4);
            border-radius: 10px;
        }

        /* Message Styles */
        .message {
            display: flex; gap: 14px;
            margin-bottom: 20px;
            animation: messageSlide 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes messageSlide {
            0% { opacity: 0; transform: translateY(20px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message.user {
            flex-direction: row-reverse;
        }
        .message .avatar {
            width: 40px; height: 40px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .message.bot .avatar {
            background: linear-gradient(135deg, #A78BFA, #8b6fe0);
            box-shadow: 0 4px 15px rgba(167,139,250,0.3);
        }
        .message.user .avatar {
            background: linear-gradient(135deg, #FF6B6B, #e05555);
            box-shadow: 0 4px 15px rgba(255,107,107,0.3);
        }

        .message .bubble {
            padding: 16px 20px;
            border-radius: 18px;
            max-width: 85%;
            font-size: 15px;
            line-height: 1.7;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }

        .message.bot .bubble {
            background: rgba(167,139,250,0.15);
            border: 1px solid rgba(167,139,250,0.2);
            color: rgba(255,255,255,0.95);
        }
        .message.user .bubble {
            background: rgba(255,107,107,0.2);
            border: 1px solid rgba(255,107,107,0.2);
            color: rgba(255,255,255,0.95);
        }

        /* Markdown Styling inside bubbles */
        .message .bubble h1, 
        .message .bubble h2, 
        .message .bubble h3, 
        .message .bubble h4 {
            margin: 12px 0 8px 0;
            font-weight: 700;
        }

        .message .bubble h1 { font-size: 22px; color: #C4B5FD; }
        .message .bubble h2 { font-size: 19px; color: #C4B5FD; }
        .message .bubble h3 { font-size: 17px; color: #C4B5FD; }
        .message .bubble h4 { font-size: 15px; color: #C4B5FD; }

        .message .bubble p {
            margin: 8px 0;
            line-height: 1.7;
        }

        .message .bubble ul, 
        .message .bubble ol {
            margin: 8px 0 8px 20px;
            padding-left: 8px;
        }

        .message .bubble li {
            margin: 4px 0;
            line-height: 1.6;
        }

        .message .bubble strong {
            color: #C4B5FD;
            font-weight: 700;
        }

        .message .bubble em {
            font-style: italic;
            color: rgba(255,255,255,0.8);
        }

        .message .bubble code {
            background: rgba(0,0,0,0.3);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        .message .bubble pre {
            background: rgba(0,0,0,0.3);
            padding: 12px 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
        }

        .message .bubble blockquote {
            border-left: 3px solid #A78BFA;
            padding-left: 16px;
            margin: 8px 0;
            color: rgba(255,255,255,0.7);
        }

        .message .bubble table {
            border-collapse: collapse;
            margin: 8px 0;
            width: 100%;
        }

        .message .bubble th,
        .message .bubble td {
            border: 1px solid rgba(255,255,255,0.15);
            padding: 8px 12px;
            text-align: left;
        }

        .message .bubble th {
            background: rgba(167,139,250,0.2);
            font-weight: 600;
        }

        .message .bubble hr {
            border: none;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin: 12px 0;
        }

        .message .bubble .timestamp {
            font-size: 11px; 
            color: rgba(255,255,255,0.3);
            margin-top: 12px;
            display: block;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: none; gap: 14px;
            margin-bottom: 20px;
            padding: 12px 0;
        }
        .typing-indicator.active {
            display: flex;
        }
        .typing-indicator .avatar {
            width: 40px; height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #A78BFA, #8b6fe0);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(167,139,250,0.3);
        }
        .typing-dots {
            display: flex; gap: 6px;
            padding: 16px 24px;
            background: rgba(167,139,250,0.1);
            border: 1px solid rgba(167,139,250,0.15);
            border-radius: 18px;
        }
        .typing-dots span {
            width: 8px; height: 8px;
            background: rgba(167,139,250,0.6);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        /* Input Area */
        .input-area {
            display: flex; gap: 14px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--glass-border);
        }
        .input-area input {
            flex: 1;
            padding: 16px 22px;
            border-radius: 100px;
            border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.06);
            color: white;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s;
            outline: none;
        }
        .input-area input::placeholder {
            color: rgba(255,255,255,0.3);
        }
        .input-area input:focus {
            border-color: rgba(167,139,250,0.5);
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 30px rgba(167,139,250,0.08);
        }
        .input-area .send-btn {
            padding: 16px 32px;
            border-radius: 100px;
            border: none;
            background: linear-gradient(135deg, #A78BFA, #8b6fe0);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex; align-items: center; gap: 10px;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(167,139,250,0.3);
        }
        .input-area .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(167,139,250,0.4);
        }
        .input-area .send-btn:active {
            transform: scale(0.95);
        }
        .input-area .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Quick Suggestions */
        .suggestions {
            display: flex; gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            padding: 4px 0;
        }
        .suggestions .suggestion-chip {
            padding: 8px 18px;
            border-radius: 100px;
            background: rgba(167,139,250,0.1);
            border: 1px solid rgba(167,139,250,0.15);
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .suggestions .suggestion-chip:hover {
            background: rgba(167,139,250,0.2);
            border-color: rgba(167,139,250,0.3);
            color: white;
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 700px) {
            .main-container { padding: 16px; }
            .header { flex-direction: column; gap: 16px; align-items: flex-start; }
            .header-title h1 { font-size: 22px; }
            .header-title .ai-icon { width: 42px; height: 42px; font-size: 20px; }
            .message .bubble { max-width: 90%; font-size: 14px; }
            .input-area { flex-direction: column; }
            .input-area .send-btn { justify-content: center; }
            .server-status { font-size: 10px; padding: 4px 10px; }
        }

        @media (max-width: 500px) {
            .chat-container { padding: 16px; min-height: 500px; }
            .messages-area { max-height: 400px; }
            .message .bubble { padding: 14px 16px; }
            .suggestions .suggestion-chip { font-size: 12px; padding: 6px 14px; }
            .input-area input { padding: 14px 18px; font-size: 14px; }
            .input-area .send-btn { padding: 14px 24px; font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="main-container">
        <!-- Header -->
        <div class="header">
            <button class="back-btn" onclick="goBack()">
                <i class="fas fa-arrow-left"></i> Back
            </button>
            <div class="header-title">
                <div class="ai-icon"><i class="fas fa-robot"></i></div>
                <div>
                    <h1>AI Science Tutor</h1>
                    <div class="subtitle">Powered by RAG &amp; NCERT Textbooks</div>
                </div>
            </div>
            <div class="server-status" id="serverStatus">
                <span class="status-dot"></span>
                <span id="statusText">Checking...</span>
            </div>
        </div>

        <!-- Chat Container -->
        <div class="chat-container">
            <!-- Suggestions -->
            <div class="suggestions" id="suggestions">
                <span class="suggestion-chip" onclick="sendSuggestion('What is photosynthesis?')">🌿 Photosynthesis</span>
                <span class="suggestion-chip" onclick="sendSuggestion('Explain Newton\'s laws')">⚡ Newton's Laws</span>
                <span class="suggestion-chip" onclick="sendSuggestion('What is an acid?')">🧪 Acids & Bases</span>
                <span class="suggestion-chip" onclick="sendSuggestion('How do cells work?')">🧬 Cell Biology</span>
            </div>

            <!-- Messages -->
            <div class="messages-area" id="messagesArea">
                <div class="message bot">
                    <div class="avatar"><i class="fas fa-robot"></i></div>
                    <div class="bubble">
                        👋 Hello! I'm your AI Science Tutor. I can help you with Physics, Chemistry, and Biology questions based on NCERT textbooks. What would you like to learn today?
                        <span class="timestamp">Just now</span>
                    </div>
                </div>
            </div>

            <!-- Typing Indicator -->
            <div class="typing-indicator" id="typingIndicator">
                <div class="avatar"><i class="fas fa-robot"></i></div>
                <div class="typing-dots">
                    <span></span><span></span><span></span>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Ask me anything about science..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    Send <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // FIX: Get base URL for navigation back to main site
        // ============================================================
        function getWebsiteBaseUrl() {
            // If we're on port 5000 (AI server), go back to port 8000
            if (window.location.port === '5000') {
                return 'http://localhost:8000';
            }
            // If we're already on port 8000, stay there
            if (window.location.port === '8000') {
                return '';
            }
            // Default fallback
            return 'http://localhost:8000';
        }

        // ============================================================
        // Navigation - FIXED to go back to port 8000
        // ============================================================
        function goBack() {
            const baseUrl = getWebsiteBaseUrl();
            document.body.style.transition = 'opacity 0.4s, transform 0.4s';
            document.body.style.opacity = '0';
            document.body.style.transform = 'scale(0.97)';
            
            setTimeout(() => {
                window.location.href = baseUrl + '/index.html';
            }, 400);
        }

        function goHome() {
            const baseUrl = getWebsiteBaseUrl();
            document.body.style.transition = 'opacity 0.4s, transform 0.4s';
            document.body.style.opacity = '0';
            document.body.style.transform = 'scale(0.97)';
            
            setTimeout(() => {
                window.location.href = baseUrl + '/index.html';
            }, 400);
        }

        // ============================================================
        // Configure marked for better rendering
        // ============================================================
        marked.setOptions({
            breaks: true,
            gfm: true,
            headerIds: false,
            mangle: false
        });

        // ============================================================
        // API Configuration & State
        // ============================================================
        const API_URL = 'http://localhost:5000/api/chat';
        const HEALTH_URL = 'http://localhost:5000/api/health';
        let isProcessing = false;
        let serverAvailable = false;
        let serverChecked = false;
        let isFirstMessage = true;

        // ============================================================
        // Server Status Management
        // ============================================================
        async function checkServerAvailability(showMessage = false) {
            const statusEl = document.getElementById('serverStatus');
            const statusText = document.getElementById('statusText');
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2000);
                
                const response = await fetch(HEALTH_URL, {
                    method: 'GET',
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                if (response.ok) {
                    const data = await response.json();
                    serverAvailable = true;
                    statusEl.className = 'server-status online';
                    statusText.textContent = data.knowledge_loaded ? 'AI Online' : 'Loading...';
                    
                    if (showMessage && !data.knowledge_loaded) {
                        addMessage('📚 The AI knowledge base is still loading. You can still ask questions - I\'ll use my offline knowledge!', 'bot');
                    }
                } else {
                    serverAvailable = false;
                    statusEl.className = 'server-status offline';
                    statusText.textContent = 'Offline Mode';
                    
                    if (showMessage) {
                        addMessage('📡 AI server is not available. I\'ll use my offline knowledge base to help you!', 'bot');
                    }
                }
            } catch (error) {
                serverAvailable = false;
                statusEl.className = 'server-status offline';
                statusText.textContent = 'Offline Mode';
                
                if (showMessage) {
                    addMessage('📡 AI server is not running. I\'ll help with my offline knowledge base!', 'bot');
                }
            }
            
            serverChecked = true;
        }

        // ============================================================
        // Local Knowledge Base (Offline Mode)
        // ============================================================
        const LOCAL_KNOWLEDGE = {
            'photosynthesis': '🌿 Photosynthesis is the process by which plants use sunlight, water, and carbon dioxide to create oxygen and energy in the form of sugar.\n\nEquation: 6CO₂ + 6H₂O + Light → C₆H₁₂O₆ + 6O₂',
            'newton': "⚡ Newton's three laws of motion:\n\n1. Inertia: An object at rest stays at rest, and an object in motion stays in motion, unless acted upon by a force.\n2. F = ma: Force equals mass times acceleration.\n3. Action-Reaction: For every action, there is an equal and opposite reaction.",
            'acid': '🧪 An acid is a substance that donates hydrogen ions (H+) in aqueous solution. Acids have a pH less than 7.\n\nExamples: HCl (Hydrochloric acid), H₂SO₄ (Sulfuric acid), Citric acid (in lemons)',
            'base': '🧪 A base is a substance that accepts hydrogen ions or releases hydroxide ions (OH-). Bases have a pH greater than 7.\n\nExamples: NaOH (Sodium hydroxide), NH₃ (Ammonia), Baking soda',
            'cell': '🧬 Cells are the basic building blocks of all living things. They provide structure, take in nutrients, and carry out important functions.\n\nTypes: Plant cells (with cell wall), Animal cells (no cell wall)',
            'force': '💪 Force is a push or pull that can change the motion of an object. Measured in Newtons (N).\n\nTypes: Contact forces (friction, tension) and Non-contact forces (gravity, magnetic)',
            'friction': '🔧 Friction is a force that opposes motion between two surfaces in contact.\n\nTypes: Static (at rest), Sliding (moving), Rolling (rolling objects)\n\nDepends on: Surface roughness and normal force',
            'light': '💡 Light is electromagnetic radiation visible to the human eye.\n\nSpeed: 299,792,458 m/s (3×10⁸ m/s)\n\nProperties: Travels in straight lines, can be reflected and refracted',
            'sound': '🔊 Sound is a vibration that travels through a medium (air, water, solids) as waves.\n\nSpeed in air: ~343 m/s\n\nCharacteristics: Frequency (pitch), Amplitude (loudness)',
            'electricity': '⚡ Electricity is the flow of electric charge (electrons) through a conductor.\n\nKey concepts:\n• Current (I) - Amperes\n• Voltage (V) - Volts\n• Resistance (R) - Ohms\n• Ohm\'s Law: V = I × R',
            'magnet': '🧲 Magnetism is a force that attracts or repels certain materials (like iron).\n\nProperties: Like poles repel, opposite poles attract\n\nApplications: Motors, generators, speakers',
            'atom': '⚛️ Atoms are the basic building blocks of matter. They consist of protons, neutrons, and electrons.\n\nParts:\n• Proton (Positive)\n• Neutron (Neutral)\n• Electron (Negative)',
            'compound': '🧪 A compound is a substance made of two or more elements chemically bonded together.\n\nExamples: H₂O (Water), NaCl (Salt), CO₂ (Carbon dioxide)',
            'element': '🔬 An element is a pure substance that cannot be broken down into simpler substances.\n\nExamples: Oxygen (O), Carbon (C), Gold (Au), Iron (Fe)',
            'reproduction': '🌱 Reproduction is the biological process by which new individual organisms are produced.\n\nTypes: Asexual (single parent), Sexual (two parents)',
            'heredity': '🧬 Heredity is the passing of traits from parents to offspring through genes.\n\nKey terms: DNA, Genes, Chromosomes, Alleles',
            'ecosystem': '🌍 An ecosystem is a community of living organisms interacting with their non-living environment.\n\nComponents: Biotic (living) and Abiotic (non-living)\n\nTypes: Terrestrial, Aquatic',
            'dna': '🧬 DNA (Deoxyribonucleic Acid) carries genetic information in all living organisms.\n\nStructure: Double helix\n\nBases: A (Adenine), T (Thymine), G (Guanine), C (Cytosine)',
            'biology': '🧬 Biology is the study of living organisms and their interactions with the environment.\n\nBranches: Botany (plants), Zoology (animals), Microbiology (microorganisms)',
            'chemistry': '🧪 Chemistry is the study of matter, its properties, composition, and changes.\n\nBranches: Organic, Inorganic, Physical, Analytical',
            'physics': '⚡ Physics is the study of matter, energy, and their interactions.\n\nBranches: Mechanics, Thermodynamics, Optics, Electromagnetism'
        };

        function generateLocalResponse(message) {
            const messageLower = message.toLowerCase();
            
            for (const [key, value] of Object.entries(LOCAL_KNOWLEDGE)) {
                if (messageLower.includes(key)) {
                    return value + "\n\n📚 Is there anything else you'd like to know about this topic?";
                }
            }
            
            if (messageLower.includes('physics') || messageLower.includes('force') || messageLower.includes('energy') || messageLower.includes('motion')) {
                return "⚡ Physics topics I can help with:\n\n• Force & Pressure\n• Friction\n• Light & Optics\n• Sound\n• Electricity & Magnetism\n• Solar System\n\nWhat specific physics topic would you like to learn about?";
            } else if (messageLower.includes('chemistry') || messageLower.includes('acid') || messageLower.includes('base') || messageLower.includes('metal')) {
                return "🧪 Chemistry topics I can help with:\n\n• Acids, Bases & Salts\n• Metals & Non-metals\n• Chemical Reactions\n• Carbon & its Compounds\n• Synthetic Fibres\n• Materials\n\nAsk me about any of these!";
            } else if (messageLower.includes('biology') || messageLower.includes('cell') || messageLower.includes('body') || messageLower.includes('plant')) {
                return "🧬 Biology topics I can help with:\n\n• Cell Structure & Function\n• Microorganisms\n• Human Body Systems\n• Plants & Photosynthesis\n• Ecosystems & Food Chains\n• Genetics & Heredity\n\nWhat would you like to explore?";
            }
            
            return "🤖 I'm your AI Science Tutor! I can help you with:\n\n🔬 **Physics** - Force, Light, Sound, Electricity, Friction\n🧪 **Chemistry** - Acids, Metals, Reactions, Compounds\n🧬 **Biology** - Cells, Human Body, Plants, Ecosystems\n\nWhat would you like to learn about today? Just ask me any science question!";
        }

        // ============================================================
        // Send Message
        // ============================================================
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message || isProcessing) return;
            
            input.value = '';
            addMessage(message, 'user');
            showTyping(true);
            isProcessing = true;
            document.getElementById('sendBtn').disabled = true;
            
            if (!serverChecked) {
                await checkServerAvailability(true);
            }
            
            try {
                if (!serverAvailable) {
                    showTyping(false);
                    await new Promise(resolve => setTimeout(resolve, 300));
                    const localResponse = generateLocalResponse(message);
                    addMessage(localResponse + '\n\n📡 (Offline mode)', 'bot');
                    isProcessing = false;
                    document.getElementById('sendBtn').disabled = false;
                    return;
                }
                
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000);
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        student_id: 'default'
                    }),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                const data = await response.json();
                showTyping(false);
                
                if (data.success) {
                    addMessage(data.response, 'bot');
                } else {
                    const localResponse = generateLocalResponse(message);
                    addMessage(localResponse + '\n\n⚠️ (AI server error - using offline mode)', 'bot');
                    console.error('Server error:', data.error);
                }
            } catch (error) {
                showTyping(false);
                console.log('Server error:', error);
                const localResponse = generateLocalResponse(message);
                addMessage(localResponse + '\n\n📡 (Offline mode - AI server not available)', 'bot');
            } finally {
                isProcessing = false;
                document.getElementById('sendBtn').disabled = false;
            }
        }

        // ============================================================
        // UI Helpers
        // ============================================================
        function addMessage(text, sender) {
            const area = document.getElementById('messagesArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const now = new Date();
            const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            let content = text;
            if (sender === 'bot') {
                try {
                    content = marked.parse(text);
                } catch (e) {
                    console.warn('Markdown parsing failed, using plain text:', e);
                    content = `<p>${text}</p>`;
                }
            } else {
                content = `<p>${text}</p>`;
            }
            
            messageDiv.innerHTML = `
                <div class="avatar">
                    <i class="fas ${sender === 'bot' ? 'fa-robot' : 'fa-user'}"></i>
                </div>
                <div class="bubble">
                    ${content}
                    <span class="timestamp">${time}</span>
                </div>
            `;
            
            area.appendChild(messageDiv);
            area.scrollTop = area.scrollHeight;
        }

        function showTyping(show) {
            const indicator = document.getElementById('typingIndicator');
            indicator.classList.toggle('active', show);
            if (show) {
                document.getElementById('messagesArea').scrollTop = document.getElementById('messagesArea').scrollHeight;
            }
        }

        function sendSuggestion(text) {
            document.getElementById('messageInput').value = text;
            sendMessage();
        }

        // ============================================================
        // Auto-resize input on mobile
        // ============================================================
        document.getElementById('messageInput').addEventListener('focus', function() {
            setTimeout(() => {
                document.getElementById('messagesArea').scrollTop = document.getElementById('messagesArea').scrollHeight;
            }, 300);
        });

        // ============================================================
        // Handle offline/online status
        // ============================================================
        window.addEventListener('online', function() {
            addMessage('🔄 Connection restored! Checking AI server...', 'bot');
            serverChecked = false;
            setTimeout(() => checkServerAvailability(true), 1000);
        });

        window.addEventListener('offline', function() {
            serverAvailable = false;
            serverChecked = true;
            const statusEl = document.getElementById('serverStatus');
            statusEl.className = 'server-status offline';
            document.getElementById('statusText').textContent = 'Offline';
            addMessage('⚠️ You are offline. I\'ll use my offline knowledge base.', 'bot');
        });

        // ============================================================
        // Initialize
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            const initialBubble = document.querySelector('.message.bot .bubble');
            if (initialBubble) {
                const text = initialBubble.textContent.replace('Just now', '').trim();
                try {
                    initialBubble.innerHTML = marked.parse(text) + '<span class="timestamp">Just now</span>';
                } catch (e) {}
            }
            
            setTimeout(() => {
                checkServerAvailability(false);
            }, 1500);
        });
    </script>
